apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pcap-controller
  namespace: kube-system
  labels:
    app: pcap-controller
spec:
  selector:
    matchLabels:
      app: pcap-controller
  template:
    metadata:
      labels:
        app: pcap-controller
    spec:
      serviceAccountName: pcap-controller
      hostPID: true
      containers:
        - name: controller
          image: pcap-controller:latest
          imagePullPolicy: Never
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: pcap-output
              mountPath: /captures
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: pcap-output
          hostPath:
            path: /tmp/pcap-captures
            type: DirectoryOrCreate
