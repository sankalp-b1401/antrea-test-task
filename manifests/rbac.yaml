apiVersion: v1
kind: ServiceAccount
metadata:
  name: pcap-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pcap-controller-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pcap-controller-binding
subjects:
  - kind: ServiceAccount
    name: pcap-controller
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: pcap-controller-role
  apiGroup: rbac.authorization.k8s.io
